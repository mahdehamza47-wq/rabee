<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f2937">
  <title>القائمة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0 0 90px;
      background: #f5f6f8;
      color: #1f2937;
      font-family: Arial, Tahoma, sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .top-header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 14px 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .restaurant-name {
      margin: 0;
      font-size: 25px;
      line-height: 1.3;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .restaurant-note {
      margin: 5px 0 10px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .mode-bar {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .search-wrap {
      padding: 12px 14px 5px;
      background: #ffffff;
    }

    .search-input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .search-input:focus {
      border-color: #64748b;
    }

    .section-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px 12px;
      background: #ffffff;
      position: sticky;
      top: 117px;
      z-index: 15;
      scrollbar-width: none;
    }

    .section-nav::-webkit-scrollbar {
      display: none;
    }

    .section-nav button {
      flex: 0 0 auto;
      border: 0;
      background: #e5e7eb;
      color: #374151;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    .section-nav button.active {
      background: #1f2937;
      color: #ffffff;
    }

    .menu-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 8px 12px 30px;
    }

    .menu-section {
      margin-bottom: 28px;
      scroll-margin-top: 180px;
    }

    .section-title {
      margin: 8px 2px 12px;
      font-size: 21px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .menu-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      min-width: 0;
    }

    .menu-card.unavailable {
      opacity: 0.48;
    }

    .item-name {
      margin: 0 0 5px;
      font-size: 17px;
      line-height: 1.5;
      font-weight: 800;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .item-description {
      margin: 0 0 11px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .item-price {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .add-button {
      border: 0;
      background: #1f2937;
      color: #ffffff;
      border-radius: 10px;
      min-height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .add-button:active {
      transform: scale(0.97);
    }

    .unavailable-label {
      color: #6b7280;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-controls button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 9px;
      background: #e5e7eb;
      color: #111827;
      font-size: 21px;
      font-weight: 800;
    }

    .quantity-number {
      min-width: 24px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
    }

    .empty-search {
      display: none;
      text-align: center;
      padding: 35px 15px;
      color: #6b7280;
      font-size: 15px;
    }

    .cart-bar {
      position: fixed;
      right: 12px;
      left: 12px;
      bottom: 12px;
      min-height: 58px;
      background: #111827;
      color: #ffffff;
      border-radius: 15px;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 9px 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .cart-bar.visible {
      display: flex;
    }

    .cart-label {
      font-size: 14px;
      line-height: 1.5;
    }

    .cart-total {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .order-modal {
      width: 100%;
      max-width: 650px;
      max-height: 92vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      padding: 18px 14px 25px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .modal-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .close-button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #f3f4f6;
      font-size: 22px;
    }

    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 0;
    }

    .order-item-info {
      min-width: 0;
      flex: 1;
    }

    .order-item-name {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .order-item-line-total {
      margin-top: 3px;
      color: #6b7280;
      font-size: 13px;
    }

    .order-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .order-controls button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: #e5e7eb;
      font-size: 18px;
      font-weight: 800;
    }

    .delete-button {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 0;
      font-size: 18px;
      font-weight: 800;
    }

    .delivery-form {
      display: none;
      margin-top: 5px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }

    .delivery-form.visible {
      display: block;
    }

    .field-group {
      margin-bottom: 13px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .field-input {
      width: 100%;
      min-height: 45px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
    }

    .field-input.invalid {
      border-color: #dc2626;
    }

    .field-error {
      min-height: 18px;
      margin-top: 4px;
      color: #dc2626;
      font-size: 12px;
      line-height: 1.5;
    }

    .send-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #15803d;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      margin-top: 5px;
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .browse-message {
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 10px;
      padding: 11px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    .no-items {
      text-align: center;
      color: #6b7280;
      padding: 25px 10px;
    }

    @media (min-width: 600px) {
      .menu-container {
        padding-left: 18px;
        padding-right: 18px;
      }

      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .cart-bar {
        max-width: 620px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <header class="top-header">
    <h1 class="restaurant-name" id="restaurantName"></h1>
    <p class="restaurant-note" id="restaurantNote"></p>
    <div class="mode-bar" id="modeBar"></div>
  </header>

  <div class="search-wrap">
    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="ابحث عن صنف..."
      autocomplete="off"
      aria-label="البحث في القائمة"
    >
  </div>

  <nav class="section-nav" id="sectionNav"></nav>

  <main class="menu-container" id="menuContainer"></main>

  <div class="empty-search" id="emptySearch">
    لا توجد أصناف تطابق البحث.
  </div>

  <div class="cart-bar" id="cartBar">
    <div class="cart-label">
      <span id="cartCount">0</span> صنف
    </div>
    <div class="cart-total" id="cartTotal">0 د.ع</div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="order-modal" role="dialog" aria-modal="true">

      <div class="modal-header">
        <h2 class="modal-title">ملخص الطلب</h2>
        <button class="close-button" id="closeModal" type="button" aria-label="إغلاق">×</button>
      </div>

      <div id="orderItems"></div>

      <div class="order-total-row">
        <span>المجموع</span>
        <span id="modalTotal">0 د.ع</span>
      </div>

      <div class="delivery-form" id="deliveryForm">

        <div class="field-group">
          <label class="field-label" for="customerName">الاسم</label>
          <input
            class="field-input"
            id="customerName"
            type="text"
            autocomplete="name"
          >
          <div class="field-error" id="customerNameError"></div>
        </div>

        <div class="field-group">
          <label class="field-label" for="customerAddress">العنوان</label>
          <input
            class="field-input"
            id="customerAddress"
            type="text"
            autocomplete="street-address"
          >
          <div class="field-error" id="customerAddressError"></div>
        </div>

        <div class="field-group">
          <label class="field-label" for="customerPhone">رقم الهاتف</label>
          <input
            class="field-input"
            id="customerPhone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
          >
          <div class="field-error" id="customerPhoneError"></div>
        </div>

      </div>

      <div class="browse-message" id="browseMessage" style="display:none;"></div>

      <button class="send-button" id="sendButton" type="button">
        إرسال الطلب عبر واتساب
      </button>

    </section>
  </div>

  <script>
    /* ==================== EDITABLE SETTINGS START ==================== */

    /* SHOP contains the restaurant name and the short note shown in the header. */
    const SHOP = {
      name: "الربيع",
      note: "مأكولات متنوعة"
    };

    /* PHONE contains the WhatsApp number used for hall table orders in international format without the plus sign. */
    const PHONE = "9647721314373";

    /* DELIVERY_PHONE contains the WhatsApp number used for delivery orders in international format without the plus sign. */
    const DELIVERY_PHONE = "9647722110030";

    /* MAX_TABLES defines the highest valid hall table number. */
    const MAX_TABLES = 13;

    /* MENU contains the menu sections and their food and drink items. */
    const MENU = [
      {
        name: "أطباق رئيسية",
        items: [
          {
            name: "دجاجة كاملة",
            description: "",
            price: 12000,

          },

            description: "",

            available: true
          },
          {
            name: "نصف نفر شاورما لحم",
            description: "",
            price: 6000,
            available: true
          },
          {
            name: "نصف نفر شاورما دجاج",
            description: "",
            price: 6000,
            available: true
          },
          {
            name: "لحم بعجين عادي",
            description: "",
            price: 2000,
            available: true
          },
          {
            name: "لحم بعجين بالبصل",
            description: "",
            price: 2500,
            available: true
          },
          {
            name: "لحم بعجين بالبيض",
            description: "",
            price: 2500,
            available: true
          },
          {
            name: "لحم بعجين بالجبن",
            description: "",
            price: 3000,

          },
          {
            name: "وجبة كنتاكي 3 قطع",

          },
          {

          },
          {
            name: "صاج بالدجاج",

          },
          {
            name: "صاج بالجبن والموزريلا",

          },
          {

          },
          {

          },
          {
            name: "برگر دبل بالجبن",
            description: "",

          },
          {
            name: "سندويش زنكر",
            description: "",

            available: true
          },
          {
            name: "طبق زنكر",
            description: "",

            available: true
          }
        ]
      },
      {
        name: "مشروبات",
        items: [
          {
            name: "مشروبات غازية",
            description: "",
            price: 500,
            available: true
          },
          {
            name: "عصائر بأنواعها",
            description: "",
            price: 500,
            available: true
          }
        ]
      }
    ];

    /* ==================== EDITABLE SETTINGS END ==================== */

    const state = {
      cart: {},
      mode: "browse",
      tableNumber: null
    };

    const restaurantName = document.getElementById("restaurantName");
    const restaurantNote = document.getElementById("restaurantNote");
    const modeBar = document.getElementById("modeBar");
    const sectionNav = document.getElementById("sectionNav");
    const menuContainer = document.getElementById("menuContainer");
    const searchInput = document.getElementById("searchInput");
    const emptySearch = document.getElementById("emptySearch");

    const cartBar = document.getElementById("cartBar");
    const cartCount = document.getElementById("cartCount");
    const cartTotal = document.getElementById("cartTotal");

    const modalBackdrop = document.getElementById("modalBackdrop");
    const closeModal = document.getElementById("closeModal");
    const orderItems = document.getElementById("orderItems");
    const modalTotal = document.getElementById("modalTotal");

    const deliveryForm = document.getElementById("deliveryForm");
    const browseMessage = document.getElementById("browseMessage");
    const sendButton = document.getElementById("sendButton");

    const customerName = document.getElementById("customerName");
    const customerAddress = document.getElementById("customerAddress");
    const customerPhone = document.getElementById("customerPhone");

    const customerNameError = document.getElementById("customerNameError");
    const customerAddressError = document.getElementById("customerAddressError");
    const customerPhoneError = document.getElementById("customerPhoneError");

    restaurantName.textContent = SHOP.name;
    restaurantNote.textContent = SHOP.note;
    document.title = SHOP.name;

    function formatPrice(value) {
      return Number(value).toLocaleString("en-US") + " د.ع";
    }

    function getItemKey(sectionIndex, itemIndex) {
      return sectionIndex + "_" + itemIndex;
    }

    function parseOrderMode() {
      const params = new URLSearchParams(window.location.search);

      const t = params.get("t");
      const d = params.get("d");

      if (t !== null && /^[1-9]\d*$/.test(t)) {
        const table = Number(t);

        if (
          Number.isInteger(table) &&
          table >= 1 &&
          table <= MAX_TABLES
        ) {
          state.mode = "table";
          state.tableNumber = table;
          return;
        }
      }

      if (d === "1") {
        state.mode = "delivery";
        state.tableNumber = null;
        return;
      }

      state.mode = "browse";
      state.tableNumber = null;
    }

    function updateModeUI() {
      if (state.mode === "table") {
        modeBar.textContent = "وضع الطلب: صالة — طاولة رقم " + state.tableNumber;
        browseMessage.style.display = "none";
        sendButton.style.display = "block";
        deliveryForm.classList.remove("visible");
      } else if (state.mode === "delivery") {
        modeBar.textContent = "وضع الطلب: توصيل";
        browseMessage.style.display = "none";
        sendButton.style.display = "block";
        deliveryForm.classList.add("visible");
      } else {
        modeBar.textContent = "وضع التصفح فقط";
        browseMessage.textContent =
          "هذه الصفحة في وضع التصفح فقط، ولا يمكن إرسال طلب من هذا الرابط.";
        browseMessage.style.display = "block";
        sendButton.style.display = "none";
        deliveryForm.classList.remove("visible");
      }
    }

    function renderSectionNav() {
      sectionNav.innerHTML = "";

      MENU.forEach(function(section, sectionIndex) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = section.name;

        button.addEventListener("click", function() {
          const sectionElement = document.getElementById(
            "section-" + sectionIndex
          );

          if (sectionElement) {
            sectionElement.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });
          }
        });

        sectionNav.appendChild(button);
      });
    }

    function renderMenu(filterText) {
      const query = String(filterText || "").trim().toLowerCase();

      menuContainer.innerHTML = "";

      let visibleCount = 0;

      MENU.forEach(function(section, sectionIndex) {
        const matchingItems = section.items.filter(function(item) {
          if (!query) {
            return true;
          }

          const name = String(item.name).toLowerCase();
          const description = String(item.description || "").toLowerCase();

          return (
            name.includes(query) ||
            description.includes(query)
          );
        });

        if (matchingItems.length === 0) {
          return;
        }

        visibleCount += matchingItems.length;

        const sectionElement = document.createElement("section");
        sectionElement.className = "menu-section";
        sectionElement.id = "section-" + sectionIndex;

        const title = document.createElement("h2");
        title.className = "section-title";
        title.textContent = section.name;

        const grid = document.createElement("div");
        grid.className = "menu-grid";

        matchingItems.forEach(function(item) {
          const itemIndex = section.items.indexOf(item);
          const key = getItemKey(sectionIndex, itemIndex);

          const card = document.createElement("article");
          card.className = "menu-card";

          if (!item.available) {
            card.classList.add("unavailable");
          }

          const name = document.createElement("h3");
          name.className = "item-name";
          name.textContent = item.name;

          card.appendChild(name);

          if (item.description) {
            const description = document.createElement("p");
            description.className = "item-description";
            description.textContent = item.description;
            card.appendChild(description);
          }

          const bottom = document.createElement("div");
          bottom.className = "item-bottom";

          const price = document.createElement("div");
          price.className = "item-price";
          price.textContent = formatPrice(item.price);

          bottom.appendChild(price);

          if (!item.available) {
            const unavailable = document.createElement("span");
            unavailable.className = "unavailable-label";
            unavailable.textContent = "غير متوفر";
            bottom.appendChild(unavailable);
          } else {
            const quantity = state.cart[key] || 0;

            if (quantity > 0) {
              const controls = createQuantityControls(
                sectionIndex,
                itemIndex,
                quantity
              );

              bottom.appendChild(controls);
            } else {
              const addButton = document.createElement("button");
              addButton.className = "add-button";
              addButton.type = "button";
              addButton.textContent = "إضافة";

              addButton.addEventListener("click", function() {
                addToCart(sectionIndex, itemIndex);
              });

              bottom.appendChild(addButton);
            }
          }

          card.appendChild(bottom);
          grid.appendChild(card);
        });

        sectionElement.appendChild(title);
        sectionElement.appendChild(grid);
        menuContainer.appendChild(sectionElement);
      });

      emptySearch.style.display = visibleCount === 0 ? "block" : "none";
    }

    function createQuantityControls(sectionIndex, itemIndex, quantity) {
      const wrapper = document.createElement("div");
      wrapper.className = "quantity-controls";

      const minus = document.createElement("button");
      minus.type = "button";
      minus.textContent = "−";
      minus.setAttribute("aria-label", "إنقاص الكمية");

      minus.addEventListener("click", function() {
        decreaseCart(sectionIndex, itemIndex);
      });

      const number = document.createElement("span");
      number.className = "quantity-number";
      number.textContent = quantity;

      const plus = document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      plus.setAttribute("aria-label", "زيادة الكمية");

      plus.addEventListener("click", function() {
        addToCart(sectionIndex, itemIndex);
      });

      wrapper.appendChild(minus);
      wrapper.appendChild(number);
      wrapper.appendChild(plus);

      return wrapper;
    }

    function addToCart(sectionIndex, itemIndex) {
      const item = MENU[sectionIndex].items[itemIndex];

      if (!item || !item.available) {
        return;
      }

      const key = getItemKey(sectionIndex, itemIndex);

      state.cart[key] = (state.cart[key] || 0) + 1;

      refreshCartAndMenu();
    }

    function decreaseCart(sectionIndex, itemIndex) {
      const key = getItemKey(sectionIndex, itemIndex);

      if (!state.cart[key]) {
        return;
      }

      state.cart[key] -= 1;

      if (state.cart[key] <= 0) {
        delete state.cart[key];
      }

      refreshCartAndMenu();
    }

    function removeFromCart(sectionIndex, itemIndex) {
      const key = getItemKey(sectionIndex, itemIndex);
      delete state.cart[key];
      refreshCartAndMenu();
    }

    function getCartEntries() {
      const entries = [];

      Object.keys(state.cart).forEach(function(key) {
        const parts = key.split("_");
        const sectionIndex = Number(parts[0]);
        const itemIndex = Number(parts[1]);

        const item =
          MENU[sectionIndex] &&
          MENU[sectionIndex].items[itemIndex];

        const quantity = state.cart[key];

        if (item && quantity > 0) {
          entries.push({
            key: key,
            sectionIndex: sectionIndex,
            itemIndex: itemIndex,
            item: item,
            quantity: quantity,
            lineTotal: item.price * quantity
          });
        }
      });

      return entries;
    }

    function getCartCount() {
      return getCartEntries().reduce(function(total, entry) {
        return total + entry.quantity;
      }, 0);
    }

    function getCartTotal() {
      return getCartEntries().reduce(function(total, entry) {
        return total + entry.lineTotal;
      }, 0);
    }

    function refreshCartAndMenu() {
      const count = getCartCount();
      const total = getCartTotal();

      cartCount.textContent = count;
      cartTotal.textContent = formatPrice(total);

      if (count > 0) {
        cartBar.classList.add("visible");
      } else {
        cartBar.classList.remove("visible");
      }

      renderMenu(searchInput.value);

      if (modalBackdrop.classList.contains("visible")) {
        renderOrderSummary();
      }
    }

    function renderOrderSummary() {
      const entries = getCartEntries();

      orderItems.innerHTML = "";

      if (entries.length === 0) {
        const empty = document.createElement("div");
        empty.className = "no-items";
        empty.textContent = "السلة فارغة.";
        orderItems.appendChild(empty);

        modalTotal.textContent = formatPrice(0);
        sendButton.disabled = true;
        return;
      }

      entries.forEach(function(entry) {
        const row = document.createElement("div");
        row.className = "order-item";

        const info = document.createElement("div");
        info.className = "order-item-info";

        const name = document.createElement("div");
        name.className = "order-item-name";
        name.textContent = entry.item.name;

        const lineTotal = document.createElement("div");
        lineTotal.className = "order-item-line-total";
        lineTotal.textContent =
          entry.quantity +
          " × " +
          formatPrice(entry.item.price) +
          " = " +
          formatPrice(entry.lineTotal);

        info.appendChild(name);
        info.appendChild(lineTotal);

        const controls = document.createElement("div");
        controls.className = "order-controls";

        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";

        minus.addEventListener("click", function() {
          decreaseCart(entry.sectionIndex, entry.itemIndex);
        });

        const quantity = document.createElement("span");
        quantity.className = "quantity-number";
        quantity.textContent = entry.quantity;

        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";

        plus.addEventListener("click", function() {
          addToCart(entry.sectionIndex, entry.itemIndex);
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete-button";
        remove.textContent = "×";

        remove.addEventListener("click", function() {
          removeFromCart(entry.sectionIndex, entry.itemIndex);
        });

        controls.appendChild(minus);
        controls.appendChild(quantity);
        controls.appendChild(plus);
        controls.appendChild(remove);

        row.appendChild(info);
        row.appendChild(controls);

        orderItems.appendChild(row);
      });

      modalTotal.textContent = formatPrice(getCartTotal());

      if (state.mode === "browse") {
        sendButton.disabled = true;
      } else if (state.mode === "delivery") {
        sendButton.disabled = !validateDelivery(false);
      } else {
        sendButton.disabled = false;
      }
    }

    function openModal() {
      if (getCartCount() === 0) {
        return;
      }

      renderOrderSummary();
      modalBackdrop.classList.add("visible");
      document.body.style.overflow = "hidden";
    }

    function closeOrderModal() {
      modalBackdrop.classList.remove("visible");
      document.body.style.overflow = "";
    }

    function setFieldError(input, errorElement, message) {
      input.classList.toggle("invalid", Boolean(message));
      errorElement.textContent = message;
    }

    function validateDelivery(showErrors) {
      const name = customerName.value.trim();
      const address = customerAddress.value.trim();
      const phone = customerPhone.value.trim();

      let valid = true;

      const nameError =
        name.length === 0
          ? "يرجى إدخال الاسم."
          : "";

      const addressError =
        address.length === 0
          ? "يرجى إدخال العنوان."
          : "";

      const phoneError =
        phone.length === 0
          ? "يرجى إدخال رقم الهاتف."
          : "";

      if (nameError) {
        valid = false;
      }

      if (addressError) {
        valid = false;
      }

      if (phoneError) {
        valid = false;
      }

      if (showErrors) {
        setFieldError(customerName, customerNameError, nameError);
        setFieldError(
          customerAddress,
          customerAddressError,
          addressError
        );
        setFieldError(
          customerPhone,
          customerPhoneError,
          phoneError
        );
      }

      return valid;
    }

    function buildMessage() {
      const entries = getCartEntries();
      const lines = [];

      if (state.mode === "table") {
        lines.push("طلب طاولة رقم " + state.tableNumber);
      } else {
        lines.push("طلب توصيل");
      }

      lines.push("");

      entries.forEach(function(entry) {
        lines.push(
          entry.item.name +
          " × " +
          entry.quantity +
          " — " +
          formatPrice(entry.lineTotal)
        );
      });

      lines.push("");
      lines.push("المجموع الكلي: " + formatPrice(getCartTotal()));

      if (state.mode === "delivery") {
        lines.push("");
        lines.push("الاسم: " + customerName.value.trim());
        lines.push("العنوان: " + customerAddress.value.trim());
        lines.push("الهاتف: " + customerPhone.value.trim());
      }

      return lines.join("\n");
    }

    function sendOrder() {
      if (getCartCount() === 0) {
        return;
      }

      if (state.mode === "browse") {
        return;
      }

      if (state.mode === "delivery") {
        if (!validateDelivery(true)) {
          renderOrderSummary();
          return;
        }
      }

      const phone =
        state.mode === "delivery"
          ? DELIVERY_PHONE
          : PHONE;

      const message = encodeURIComponent(buildMessage());

      const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        message;

      window.location.href = url;
    }

    searchInput.addEventListener("input", function() {
      renderMenu(searchInput.value);
    });

    cartBar.addEventListener("click", openModal);

    closeModal.addEventListener("click", closeOrderModal);

    modalBackdrop.addEventListener("click", function(event) {
      if (event.target === modalBackdrop) {
        closeOrderModal();
      }
    });

    customerName.addEventListener("input", function() {
      if (state.mode === "delivery") {
        validateDelivery(true);
        renderOrderSummary();
      }
    });

    customerAddress.addEventListener("input", function() {
      if (state.mode === "delivery") {
        validateDelivery(true);
        renderOrderSummary();
      }
    });

    customerPhone.addEventListener("input", function() {
      if (state.mode === "delivery") {
        validateDelivery(true);
        renderOrderSummary();
      }
    });

    sendButton.addEventListener("click", sendOrder);

    parseOrderMode();
    updateModeUI();
    renderSectionNav();
    renderMenu("");
  </script>

</body>
</html>
